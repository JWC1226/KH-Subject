# Server port / context-path
# Keeps the same URL as the old Eclipse Dynamic Web project: http://localhost:8888/mdgs/
server.port=8888
server.servlet.context-path=/mdgs

# Oracle 21c XE Database (moved out of the old config/DBConnection.java hardcoded values)
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=C##MDGS
spring.datasource.password=mdgs

# MyBatis XML Mapper location
mybatis.mapper-locations=classpath:mapper/**/*.xml
# Type alias packages, so XML can use just the class name (Game / User), comma-separated for multiple packages
mybatis.type-aliases-package=com.kh.mdgs.game,com.kh.mdgs.member

# JSP ViewResolver: Controller return value -> actual JSP file path
# e.g. return "gameList"; -> /WEB-INF/views/gameList.jsp
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
