# 과제용 설정 (Oracle 21c XE 로컬 환경)
# 비밀 값(DB 비밀번호, AES 키)은 기본값 없는 환경 변수로만 주입한다. 없으면 기동되지 않는다(fail-fast).
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XE
spring.datasource.username=C##SECURE
spring.datasource.password=${ASSIGN_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# AES 키(Base64, 16/24/32바이트)
assign.aes-key=${ASSIGN_AES_KEY}
logging.level.edu.secure.assign=INFO
# 로그 위조 방지: 로그 메시지 안의 줄바꿈을 공백으로 바꾼다(스택 트레이스는 유지).
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] %-40.40logger{39} : %replace(%m){'[\\r\\n]+', ' '}%n%wEx

# 세션: 10분 미사용 시 만료, URL 에 세션 ID 노출 금지, 스크립트의 쿠키 접근 차단
server.servlet.session.timeout=10m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true

# 기본 오류 페이지(/error)에도 스택 트레이스·예외 메시지를 넣지 않는다.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# 폼 본문 크기 상한 (JSON 본문은 RequestGuardFilter 가 16KB 로 제한)
server.tomcat.max-http-form-post-size=16KB

# SameSite=Lax: 외부 사이트 POST 에 세션 쿠키가 실리지 않게 한다(CSRF 2차 방어).
# 켜면 csrf-attack.html 이 401 로 먼저 막혀 토큰 검증(403)을 확인할 수 없으므로, 확인 후 주석을 해제한다.
#server.servlet.session.cookie.same-site=lax
